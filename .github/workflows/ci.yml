name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend tests (PHP)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_sqlite, sqlite3, mbstring, curl, dom, fileinfo, gd

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: apps/backend/vendor
          key: composer-${{ hashFiles('apps/backend/composer.lock') }}

      - run: composer install --no-interaction --prefer-dist

      - run: cp .env.example .env

      - run: php artisan key:generate

      - name: Run backend test suite (sqlite in-memory — see phpunit.xml)
        run: php artisan test

  frontend:
    name: Frontend typecheck & build (web + mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Typecheck all workspaces (daycare-web, super-admin, mobile)
        run: npm run typecheck

      - name: Build daycare-web
        run: npm --workspace @barbaari/daycare-web run build

      - name: Build super-admin
        run: npm --workspace @barbaari/super-admin run build

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_sqlite, sqlite3, mbstring, curl, dom, fileinfo, gd

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Uses a file-backed sqlite DB, not the :memory: one PHPUnit uses — a background
      # `serve` process needs the data to persist across separate requests.
      - name: Prepare backend
        working-directory: apps/backend
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate
          touch database/e2e.sqlite
          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=$(pwd)/database/e2e.sqlite" >> .env
          php artisan migrate --seed --force

      - name: Start backend server
        working-directory: apps/backend
        run: nohup php artisan serve --port=8000 > /tmp/backend.log 2>&1 &

      - name: Wait for backend to accept connections
        run: npx wait-on http://127.0.0.1:8000/up --timeout 30000

      # DatabaseSeeder's fixture tenant/admin (see e2e/daycare.spec.ts, e2e/super-admin.spec.ts)
      # is what these specs actually log in as — this is real, not a stub.
      - name: Run Playwright e2e suite
        env:
          VITE_API_URL: http://127.0.0.1:8000/api
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
